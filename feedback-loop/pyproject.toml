[project]
name = "feedback-loop"
version = "0.1.0"
description = "Loop: Claude-powered feedback triage and a close-the-loop digest for a public issue tracker"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "anthropic>=2.3",
  "duckdb>=1.1",
  "httpx>=0.27",
  "pydantic>=2.7",
  "pyyaml>=6",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]

[project.scripts]
loop = "loop.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/loop"]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-m 'not live'"
markers = ["live: calls real external APIs (needs credentials)"]
